name: Build Aditya Online APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Verify Signed APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./Aditya-Online-Center.apk

      - name: Upload Aditya Online APK
        uses: actions/upload-artifact@v4
        with:
          name: Aditya-Online-Center-APK
          path: ./Aditya-Online-Center.apk
          if-no-files-found: error
